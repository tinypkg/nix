name: Update packages

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
    inputs:
      package:
        description: "Update only this package (leave empty for all packages)"
        required: false
        type: string
      version:
        description: "Override the detected version (requires package)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: package-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update directly from upstream sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/update-sources.sh "${{ inputs.package }}" "${{ inputs.version }}"
      - name: Update nixpkgs lock
        run: nix flake update
      - name: Run structural checks
        run: nix develop --command ./scripts/check.sh
      - name: Evaluate packages independently
        run: ./scripts/check-packages.sh evaluate
      - name: Build representative prebuilt packages
        run: ./scripts/check-packages.sh build autocli-bin blink1-tool-bin revpdf-bin
      - name: Commit updates directly to main
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --short)" ]; then
            echo "No package updates"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock packages
          git commit -m "chore: update package sources"
          git push origin HEAD:main
